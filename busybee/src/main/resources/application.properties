spring.application.name=BusyBee

# HTTPS Configuration - Certificate protected by .gitignore
# The keystore.p12 file is NOT committed to Git for security
# Generate it using: .\generate-certificate.ps1
# For production, use environment variable: SSL_KEYSTORE_PASSWORD
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:busybee-secure-password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=busybee
server.port=8443

# TLS Configuration - Prevent downgrade attacks
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Session Cookie Security - CSRF protection via SameSite
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Multipart file upload settings - Allow 10MB files (matches FileStorage.MAX_FILE_SIZE)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enable logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.com.securefromscratch.busybee=DEBUG

# Log to file
logging.file.name=application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
